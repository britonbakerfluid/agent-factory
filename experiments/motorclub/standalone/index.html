<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fluid · Mountain loop</title></head>
<body>
  <main>
    <canvas id="garage" aria-label="Fluid Factory garage with four modeled cars. Use the car buttons to inspect each model."></canvas>
    <header><div class="brand">Fluid <span>/</span> garage</div><div class="study-label">motor club · mountain loop</div></header>
    <div class="top-actions"><button id="light" aria-pressed="false">evening</button><button id="pixels" aria-pressed="true">pixels on</button></div>
    <section id="details" aria-live="polite"><p id="eyebrow">THE COLLECTION</p><h1 id="car-name">the garage.</h1><p id="car-note">choose a car to get closer.</p></section>
    <div id="model-actions" hidden><button id="doors" hidden aria-pressed="false">open gullwings</button><button id="wheels" aria-pressed="false">spin wheels</button><button id="paint" hidden>change paint</button></div>
    <nav class="mc-island" aria-label="Garage views"><button data-car="room" aria-pressed="true">garage</button><button data-car="porsche" aria-pressed="false">porsche</button><button data-car="mini" aria-pressed="false">mini cooper</button><button data-car="delorean" aria-pressed="false">delorean</button><button data-car="f1" aria-pressed="false">f1</button></nav>
    <p id="hint">drag to look around · scroll to zoom</p><p id="status" role="status">bringing the cars in…</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
